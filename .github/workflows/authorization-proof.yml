name: Groth16 authorization statement

on:
  push:
    branches: [prove-authorization-statement]
  workflow_dispatch:
    inputs:
      prove_fresh:
        description: Generate a new experimental setup and proof
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  authorization-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ZENO_DEVNET_SHA: cf1c9c0e0f0ca3b257bdbd019c5589c2c27f748f
      GOWORK: 'off'
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select the statement from verified devnet execution
        shell: bash
        run: |
          umask 077
          scratch="$(mktemp -d "$RUNNER_TEMP/vault-groth16.XXXXXX")"
          free_bytes="$(df -PB1 "$scratch" | awk 'NR == 2 {print $4}')"
          test "$free_bytes" -ge "$((16 * 1024 * 1024 * 1024))"
          devnet="$scratch/devnet"
          git init --quiet "$devnet"
          timeout 120s git -C "$devnet" fetch --quiet --depth 1 https://github.com/Zeno-L2/zeno-devnet.git "$ZENO_DEVNET_SHA"
          git -C "$devnet" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$devnet" rev-parse HEAD)" = "$ZENO_DEVNET_SHA"
          GOTOOLCHAIN=go1.26.0 ZENO_MODE=replay timeout 4m \
            bash research/zeno-contract-authorization/build-authorizer.sh "$devnet"
          evidence="research/zeno-execution-replay"
          printf '%s  %s\n' "$(cat "$evidence/authorization.sha256")" "$evidence/authorization.json" | sha256sum --check --strict
          timeout 60s "$scratch/verify-execution" statement \
            "$evidence/authorization.json" "$evidence/execution.json" "$scratch" "$(cat "$evidence/execution.sha256")" > "$scratch/replay.log"
          python3 -B - "$scratch" <<'PY'
          import json
          import sys
          from pathlib import Path

          scratch = Path(sys.argv[1])
          with (scratch / "replay.log").open("rb") as log:
              raw = log.read(16_385)
          if len(raw) > 16_384:
              raise SystemExit("Replay output exceeded its byte limit")
          prefix = b"AUTHORIZATION_STATEMENT_JSON "
          statements = [line[len(prefix):] for line in raw.splitlines() if line.startswith(prefix)]
          if len(statements) != 1 or not isinstance(json.loads(statements[0]), dict):
              raise SystemExit("Replay did not select exactly one authorization statement")
          with (scratch / "statement.json").open("xb") as selected:
              selected.write(statements[0] + b"\n")
          PY
          printf 'PROOF_SCRATCH=%s\n' "$scratch" >> "$GITHUB_ENV"

      - name: Build the pinned proof tool
        shell: bash
        env:
          GOTOOLCHAIN: go1.26.8
        run: |
          umask 077
          source=research/authorization-proof
          build="$PROOF_SCRATCH/prover"
          mkdir "$build"
          cp "$source"/*.go "$source/go.mod" "$build/"
          if [ -f "$source/go.sum" ]; then
            cp "$source/go.sum" "$build/"
          fi
          cd "$build"
          go version
          if [ ! -f go.sum ]; then
            timeout 4m go mod tidy
            test "$(stat --format=%s go.sum)" -le 32768
            printf 'PROOF_GO_MOD_BASE64 '
            base64 -w 0 go.mod
            printf '\nPROOF_GO_SUM_BASE64 '
            base64 -w 0 go.sum
            printf '\n'
          fi
          timeout 5m go build -mod=readonly -trimpath -o "$PROOF_SCRATCH/proof-tool" .
          printf 'Proof tool SHA-256 '
          sha256sum < "$PROOF_SCRATCH/proof-tool" | cut -d ' ' -f 1

      - name: Prove or verify the selected statement
        shell: bash
        env:
          PROVE_FRESH: ${{ inputs.prove_fresh }}
        run: |
          umask 077
          evidence=research/authorization-proof
          if [ "$PROVE_FRESH" = true ] || [ ! -f "$evidence/proof.sha256" ]; then
            bundle="$PROOF_SCRATCH/proof.json"
            timeout 15m /usr/bin/time -f 'PROOF_MAX_RSS_KIB %M' \
              "$PROOF_SCRATCH/proof-tool" prove "$PROOF_SCRATCH/statement.json" "$bundle"
            test "$(stat --format=%s "$bundle")" -le 16384
            printf 'AUTHORIZATION_PROOF_SHA256 '
            sha256sum < "$bundle" | cut -d ' ' -f 1
            printf 'AUTHORIZATION_PROOF_JSON '
            cat "$bundle"
          else
            timeout 60s "$PROOF_SCRATCH/proof-tool" verify "$PROOF_SCRATCH/statement.json" \
              "$evidence/proof.json" "$(cat "$evidence/proof.sha256")"
          fi
