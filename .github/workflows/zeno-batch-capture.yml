name: Zeno multi-input batch capture

on:
  push:
    branches: [prove-devnet-batch-transition]
    paths:
      - .github/workflows/zeno-batch-capture.yml
      - research/zeno-contract-authorization/capture.ts
      - research/zeno-contract-authorization/build-authorizer.sh
      - research/zeno-execution-replay/replay.go
      - research/zeno-batch-proof/batch-witness.go
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      ZENO_DEVNET_SHA: cf1c9c0e0f0ca3b257bdbd019c5589c2c27f748f
      GOTOOLCHAIN: go1.26.0
      DEVNET_BIND_ADDRESS: 127.0.0.1
      GIT_TERMINAL_PROMPT: '0'
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: url.https://github.com/.insteadOf
      GIT_CONFIG_VALUE_0: 'ssh://git@github.com/'
      GIT_CONFIG_KEY_1: url.https://github.com/.insteadOf
      GIT_CONFIG_VALUE_1: 'git@github.com:'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.17.0
          package-manager-cache: false

      - name: Prepare pinned capture and execution tools
        shell: bash
        run: |
          umask 077
          work_dir="$(mktemp -d "$RUNNER_TEMP/vault-batch.XXXXXX")"
          free_bytes="$(df -PB1 "$work_dir" | awk 'NR == 2 {print $4}')"
          test "$free_bytes" -ge "$((16 * 1024 * 1024 * 1024))"
          devnet="$work_dir/devnet"
          printf 'ZENO_DEVNET_DIR=%s\nZENO_WORK=%s\n' "$devnet" "$work_dir" >> "$GITHUB_ENV"
          git init --quiet "$devnet"
          timeout 120s git -C "$devnet" fetch --quiet --depth 1 https://github.com/Zeno-L2/zeno-devnet.git "$ZENO_DEVNET_SHA"
          git -C "$devnet" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$devnet" rev-parse HEAD)" = "$ZENO_DEVNET_SHA"
          chmod 0644 "$devnet/config/gateway.json"
          cp research/zeno-withdrawal/batch-proof.ts "$devnet/flows/"
          cp research/zeno-contract-authorization/capture.ts "$devnet/flows/vault-authorizer.ts"
          (
            cd "$devnet"
            timeout 8m npm ci --no-audit --no-fund
            timeout 2m npm run typecheck
          )
          timeout 12m bash research/zeno-contract-authorization/build-authorizer.sh "$devnet"
          python3 -B - "$work_dir/target.hex" <<'PY'
          import hashlib
          import json
          import re
          import sys
          from pathlib import Path

          root = Path("research/zeno-execution-replay")
          raw = (root / "authorization.json").read_bytes()
          if hashlib.sha256(raw).hexdigest() != (root / "authorization.sha256").read_text().strip():
              raise SystemExit("Recorded synthetic target evidence hash differs")
          target = json.loads(raw)["selection"]["bitcoinTarget"]
          if not re.fullmatch("[0-9a-f]{200}", target):
              raise SystemExit("Expected a fixed-width regtest target")
          with Path(sys.argv[1]).open("x", encoding="ascii") as output:
              output.write(target + "\n")
          PY

      - name: Start the isolated devnet
        shell: bash
        run: |
          cd "$ZENO_DEVNET_DIR"
          timeout 8m bash scripts/devnet.sh up --no-config
          timeout 10m python3 -B "$GITHUB_WORKSPACE/research/zeno-withdrawal/bootstrap.py"

      - name: Configure Settlement and the gateway
        shell: bash
        run: |
          cd "$ZENO_DEVNET_DIR"
          timeout 18m bash scripts/devnet.sh config

      - name: Capture the three-call batch and replay its committed transition
        shell: bash
        run: |
          cd "$ZENO_DEVNET_DIR"
          timeout 25m npm exec --offline -- tsx flows/vault-authorizer.ts capture-batch \
            "$ZENO_WORK/vault_authorizer" "$ZENO_WORK/target.hex" "$ZENO_WORK/authorization.json"
          timeout 120s "$ZENO_WORK/verify-execution" capture-batch \
            "$ZENO_WORK/authorization.json" "$ZENO_WORK/execution.json" "$ZENO_WORK" "$ZENO_WORK/batch.json"

      - name: Report the captured evidence
        if: always() && env.ZENO_WORK != ''
        shell: bash
        env:
          OUTCOME: ${{ job.status }}
        run: |
          printf 'BATCH_CAPTURE_OUTCOME %s\n' "$OUTCOME"
          for name in authorization execution batch; do
            file="$ZENO_WORK/$name.json"
            if [ ! -f "$file" ]; then
              test "$OUTCOME" != success
              continue
            fi
            test "$(stat --format=%s "$file")" -le 49152
            printf 'BATCH_CAPTURE_SHA256 %s ' "$name"
            sha256sum < "$file" | cut -d ' ' -f 1
            printf 'BATCH_CAPTURE_JSON %s ' "$name"
            cat "$file"
          done

      - name: Stop the isolated devnet
        if: always() && env.ZENO_DEVNET_DIR != ''
        shell: bash
        run: |
          if [ -d "$ZENO_DEVNET_DIR/.devnet" ]; then
            cd "$ZENO_DEVNET_DIR"
            timeout 60s bash scripts/devnet.sh down
          fi
