name: Zeno Settlement on-chain verification

on:
  push:
    branches: [prove-settlement-on-devnet]
    paths: [.github/workflows/zeno-settlement-devnet.yml]

permissions:
  contents: read
  actions: read

env:
  WITNESS_SHA256: '583827c2db6bb87baff06a8492742da5e9c2327f7009b73b4538de2b99a2cfcc'
  GUEST_KEY: '0x007ad642f4d257c339807e97f10dcfd1b80dc226c7aca7cc6a341ca133738a59'
  COMPRESSED_RUN: '45903287946'
  COMPRESSED_HEAD: 'b93ca91e30bb635b76c9063bfad9ba5cc6c6a004'
  COMPRESSED_ARTIFACT: '15159988463'
  COMPRESSED_ARCHIVE: 'sha256:c1a1e7e29271ce758fd59355dbf76fc7af7630db669ed7965e4ba5013ee5e591'
  COMPRESSED_SHA256: 'fafddd4edb48022bb35347870caccfa497c604e81b2e54c3e82f528b4944a1cb'
  WRAPPER_RUN: '45904849391'
  WRAPPER_HEAD: 'b622cda0465e5fc663d44e09dcbd33fdea127780'
  WRAPPER_ARTIFACT: '15157936639'
  WRAPPER_ARCHIVE: 'sha256:c981529dd89ba60260eb3adc56f6a645a450fed6ad7abfc1e8ea1c9837eac28d'
  ZKM_IMM_WRAP_VK: 'false'
  RUST_LOG: info
  RAYON_NUM_THREADS: '4'

jobs:
  outer:
    runs-on: ubuntu-24.04
    timeout-minutes: 145
    outputs:
      sha256: ${{ steps.outer.outputs.sha256 }}
      wrapper-sha256: ${{ steps.outer.outputs.wrapper-sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate the selected workflow artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          check_artifact() {
            local run="$1" head="$2" artifact="$3" digest="$4" name="$5"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" | jq -e \
              --arg head "$head" '.head_sha == $head and .run_attempt == 1 and .conclusion == "success"'
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact" | jq -e \
              --arg head "$head" --arg digest "$digest" --arg name "$name" --argjson run "$run" \
              '.workflow_run.id == $run and .workflow_run.head_sha == $head and .digest == $digest and
               .name == $name and .expired == false'
          }
          check_artifact "$COMPRESSED_RUN" "$COMPRESSED_HEAD" "$COMPRESSED_ARTIFACT" "$COMPRESSED_ARCHIVE" zeno-settlement-compressed-proof
          check_artifact "$WRAPPER_RUN" "$WRAPPER_HEAD" "$WRAPPER_ARTIFACT" "$WRAPPER_ARCHIVE" settlement-wrap-prover
          umask 077
          work="$(mktemp -d "$RUNNER_TEMP/settlement-outer.XXXXXX")"
          test "$(df -PB1 "$work" | awk 'NR == 2 {print $4}')" -ge "$((12 * 1024 * 1024 * 1024))"
          printf 'SETTLEMENT_WORK=%s\n' "$work" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          artifact-ids: ${{ env.COMPRESSED_ARTIFACT }}
          path: ${{ env.SETTLEMENT_WORK }}/compress
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.COMPRESSED_RUN }}
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          artifact-ids: ${{ env.WRAPPER_ARTIFACT }}
          path: ${{ env.SETTLEMENT_WORK }}/wrapper
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.WRAPPER_RUN }}
      - name: Shrink the selected recursive proof and verify the BN254 outer proof
        id: outer
        shell: bash
        run: |
          cd "$SETTLEMENT_WORK"
          printf '%s  %s\n' "$COMPRESSED_SHA256" compress/compressed.bin | sha256sum --check --strict
          test "$(stat -c%s wrapper/simple-go-host)" -le "$((256 * 1024 * 1024))"
          chmod 0700 wrapper/simple-go-host
          timeout 45s wrapper/simple-go-host guest-key | grep -Fx "SETTLEMENT_GUEST_KEY $GUEST_KEY"
          source "$GITHUB_WORKSPACE/research/zeno-settlement-proof/prover-resources.sh"
          enable_prover_swap "$SETTLEMENT_WORK"
          ulimit -f 262144
          /usr/bin/time -f 'SETTLEMENT_OUTER_SECONDS %e MAX_RSS_KIB %M EXIT %x' \
            timeout --kill-after=20s 130m wrapper/simple-go-host outer "$WITNESS_SHA256" compress/compressed.bin outer.bin
          outer_sha256="$(sha256sum < outer.bin | cut -d ' ' -f 1)"
          printf 'SETTLEMENT_OUTER_SHA256 %s\n' "$outer_sha256"
          printf 'sha256=%s\nwrapper-sha256=%s\n' \
            "$outer_sha256" \
            "$(sha256sum < wrapper/simple-go-host | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: zeno-settlement-outer-proof
          path: ${{ env.SETTLEMENT_WORK }}/outer.bin
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  groth16:
    needs: outer
    runs-on: ubuntu-24.04
    timeout-minutes: 230
    outputs:
      sha256: ${{ steps.groth16.outputs.sha256 }}
    env:
      OUTER_SHA256: ${{ needs.outer.outputs.sha256 }}
      WRAPPER_SHA256: ${{ needs.outer.outputs.wrapper-sha256 }}
      GOMAXPROCS: '4'
      GOGC: '60'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reserve isolated prover storage
        shell: bash
        run: |
          umask 077
          base="$RUNNER_TEMP"
          base_free="$(df -PB1 "$base" | awk 'NR == 2 {print $4}')"
          if [ -d /mnt ] && [ -w /mnt ]; then
            mounted_free="$(df -PB1 /mnt | awk 'NR == 2 {print $4}')"
            if [ "$mounted_free" -gt "$base_free" ]; then
              base=/mnt
              base_free="$mounted_free"
            fi
          fi
          test "$base_free" -ge "$((22 * 1024 * 1024 * 1024))"
          work="$(mktemp -d "$base/settlement-groth16.XXXXXX")"
          df -PB1 "$work"
          awk '/^(MemTotal|SwapTotal):/ { print }' /proc/meminfo
          printf 'SETTLEMENT_WORK=%s\n' "$work" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: zeno-settlement-outer-proof
          path: ${{ env.SETTLEMENT_WORK }}
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          artifact-ids: ${{ env.WRAPPER_ARTIFACT }}
          path: ${{ env.SETTLEMENT_WORK }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.WRAPPER_RUN }}
      - name: Stream the source-pinned Groth16 circuit files
        shell: bash
        run: |
          timeout --kill-after=15s 45m python3 -B research/zeno-settlement-proof/install-circuit.py "$SETTLEMENT_WORK/circuit"
      - name: Produce and verify the Groth16 wrapper
        id: groth16
        shell: bash
        run: |
          cd "$SETTLEMENT_WORK"
          printf '%s  %s\n' "$OUTER_SHA256" outer.bin "$WRAPPER_SHA256" simple-go-host | sha256sum --check --strict
          chmod 0700 simple-go-host
          umask 077
          mkdir tmp
          export TMPDIR="$SETTLEMENT_WORK/tmp"
          source "$GITHUB_WORKSPACE/research/zeno-settlement-proof/prover-resources.sh"
          enable_prover_swap "$SETTLEMENT_WORK"
          ulimit -f 2097152
          /usr/bin/time -f 'SETTLEMENT_GROTH16_SECONDS %e MAX_RSS_KIB %M EXIT %x' \
            timeout --kill-after=30s 170m ./simple-go-host groth16 "$WITNESS_SHA256" outer.bin circuit fixture.json
          test "$(stat -c%s fixture.json)" -le 8192
          jq -e --arg guest "$GUEST_KEY" --arg journal "$WITNESS_SHA256" \
            '.guestKey == $guest and .journal == $journal and (.proof | test("^[0-9a-f]{512}$"))' fixture.json
          fixture_sha256="$(sha256sum < fixture.json | cut -d ' ' -f 1)"
          printf 'sha256=%s\n' "$fixture_sha256" >> "$GITHUB_OUTPUT"
          printf 'SETTLEMENT_GROTH16_FIXTURE_SHA256 %s\n' "$fixture_sha256"
          printf 'SETTLEMENT_GROTH16_FIXTURE '
          cat fixture.json
          printf '\n'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: zeno-settlement-groth16-fixture
          path: ${{ env.SETTLEMENT_WORK }}/fixture.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  devnet:
    needs: groth16
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      FIXTURE_SHA256: ${{ needs.groth16.outputs.sha256 }}
      GOTOOLCHAIN: local
      GOWORK: 'off'
      GIT_TERMINAL_PROMPT: '0'
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: url.https://github.com/.insteadOf
      GIT_CONFIG_VALUE_0: 'ssh://git@github.com/'
      GIT_CONFIG_KEY_1: url.https://github.com/.insteadOf
      GIT_CONFIG_VALUE_1: 'git@github.com:'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.23.12'
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.17.0
          package-manager-cache: false
      - name: Prepare a disposable devnet workspace
        shell: bash
        run: |
          umask 077
          work="$(mktemp -d "$RUNNER_TEMP/settlement-devnet.XXXXXX")"
          printf 'SETTLEMENT_WORK=%s\n' "$work" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: zeno-settlement-groth16-fixture
          path: ${{ env.SETTLEMENT_WORK }}
      - name: Verify the proof through embedded Settlement
        shell: bash
        run: |
          printf '%s  %s\n' "$FIXTURE_SHA256" "$SETTLEMENT_WORK/fixture.json" | sha256sum --check --strict
          bash research/zeno-settlement-proof/run-devnet.sh "$SETTLEMENT_WORK" "$GUEST_KEY" "$SETTLEMENT_WORK/fixture.json"
          evidence="$SETTLEMENT_WORK/settlement-evidence.json"
          test "$(stat -c%s "$evidence")" -le 49152
          printf 'SETTLEMENT_DEVNET_EVIDENCE_SHA256 '
          sha256sum < "$evidence" | cut -d ' ' -f 1
          printf 'SETTLEMENT_DEVNET_EVIDENCE '
          cat "$evidence"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: zeno-settlement-devnet-evidence
          path: ${{ env.SETTLEMENT_WORK }}/settlement-evidence.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
