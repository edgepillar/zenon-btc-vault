name: Zeno Settlement proof experiment

on:
  push:
    branches: [prove-settlement-on-devnet]
    paths:
      - .github/workflows/zeno-settlement-proof.yml
      - research/zeno-settlement-proof/**
      - research/zeno-batch-proof/ziren/build.sh
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  CORE_RUN: '45890849209'
  CORE_ARTIFACT: '15156520239'
  CORE_ARCHIVE_SHA256: '5a7d824962dc8aa2744d816eaf585f7f156f3f8fba2200d62bf8a415eeaa4868'
  CORE_SHA256: '56a741babb892fe94a8c5fd8d62717fae7b42783ffda9fdd21c902cfa3e3db6a'
  CORE_HEAD: c794c21612c708932ff37bacddc68bd1e8eee0d6
  GUEST_ELF_SHA256: '0b05f1069b7f05fb58cc273359436d9ce752d456266336b854f201c87b3a9bd8'
  WITNESS_SHA256: '583827c2db6bb87baff06a8492742da5e9c2327f7009b73b4538de2b99a2cfcc'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      sha256: ${{ steps.prover.outputs.sha256 }}
    env:
      GIT_TERMINAL_PROMPT: '0'
      GOTOOLCHAIN: local
      GOWORK: 'off'
      CARGO_BUILD_JOBS: '3'
      RUSTFLAGS: '-C target-cpu=x86-64-v3'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.25.4'
          cache: false

      - name: Build the recursive prover with the PR 10 guest
        id: prover
        shell: bash
        run: |
          umask 077
          work_dir="$(mktemp -d "$RUNNER_TEMP/vault-settlement.XXXXXX")"
          free_bytes="$(df -PB1 "$work_dir" | awk 'NR == 2 {print $4}')"
          test "$free_bytes" -ge "$((23 * 1024 * 1024 * 1024))"
          printf 'SETTLEMENT_PROOF_DIR=%s\n' "$work_dir" >> "$GITHUB_ENV"
          if ! command -v protoc >/dev/null; then
            timeout 180s sudo apt-get -q update
            timeout 180s sudo apt-get -q install -y protobuf-compiler
          fi
          timeout 35m bash research/zeno-batch-proof/ziren/build.sh "$work_dir" \
            "$PWD/research/zeno-settlement-proof/prover.rs" | tee "$work_dir/build.log"
          grep -Fx "${GUEST_ELF_SHA256}" <(awk '/^BATCH_GUEST_ELF_SHA256$/ { getline; print }' "$work_dir/build.log")
          prover="$work_dir/target/release/simple-go-host"
          test "$(stat -c%s "$prover")" -le "$((256 * 1024 * 1024))"
          printf 'sha256=%s\n' "$(sha256sum < "$prover" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: settlement-recursive-prover
          path: ${{ env.SETTLEMENT_PROOF_DIR }}/target/release/simple-go-host
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  compress:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 245
    env:
      RAYON_NUM_THREADS: '4'
      RUST_LOG: info
      PROVER_CORE_CACHE_SIZE: '4'
      FIX_RECURSION_SHAPES: 'true'
      ZKM_IMM_WRAP_VK: 'false'
      PROVER_SHA256: ${{ needs.build.outputs.sha256 }}
    steps:
      - name: Bind the source artifact to the successful PR 10 run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CORE_RUN" | jq -e \
            --arg head "$CORE_HEAD" '.head_sha == $head and .run_attempt == 1 and .conclusion == "success"'
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$CORE_ARTIFACT" | jq -e \
            --arg head "$CORE_HEAD" --arg digest "sha256:$CORE_ARCHIVE_SHA256" --argjson run "$CORE_RUN" \
            '.name == "zeno-devnet-batch-proof" and .expired == false and .digest == $digest and
             .size_in_bytes == 150029371 and .workflow_run.id == $run and .workflow_run.head_sha == $head'
          umask 077
          work_dir="$(mktemp -d "$RUNNER_TEMP/settlement-recursion.XXXXXX")"
          free_bytes="$(df -PB1 "$work_dir" | awk 'NR == 2 {print $4}')"
          test "$free_bytes" -ge "$((12 * 1024 * 1024 * 1024))"
          printf 'SETTLEMENT_PROOF_DIR=%s\n' "$work_dir" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: settlement-recursive-prover
          path: ${{ env.SETTLEMENT_PROOF_DIR }}

      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          artifact-ids: ${{ env.CORE_ARTIFACT }}
          path: ${{ env.SETTLEMENT_PROOF_DIR }}/core
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.CORE_RUN }}

      - name: Verify and aggregate the original core proof
        shell: bash
        run: |
          cd "$SETTLEMENT_PROOF_DIR"
          [[ "$PROVER_SHA256" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "$PROVER_SHA256" simple-go-host "$CORE_SHA256" core/proof.bin | sha256sum --check --strict
          chmod 0700 simple-go-host
          ulimit -f 16384
          /usr/bin/time -f 'SETTLEMENT_COMPRESSION_SECONDS %e MAX_RSS_KIB %M EXIT %x' \
            timeout --kill-after=20s 225m ./simple-go-host compress "$WITNESS_SHA256" core/proof.bin compressed.bin

      - name: Verify the saved recursive proof in a separate process
        shell: bash
        run: |
          cd "$SETTLEMENT_PROOF_DIR"
          timeout --kill-after=10s 6m ./simple-go-host verify-compressed "$WITNESS_SHA256" compressed.bin
          printf 'SETTLEMENT_COMPRESSED_SHA256 '
          sha256sum < compressed.bin | cut -d ' ' -f 1

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: zeno-settlement-compressed-proof
          path: ${{ env.SETTLEMENT_PROOF_DIR }}/compressed.bin
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
