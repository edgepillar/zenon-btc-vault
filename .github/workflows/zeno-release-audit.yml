name: Zeno release evidence audit

on:
  push:
    branches: [prove-regtest-release-after-validity]
    paths:
      - .github/workflows/zeno-release-audit.yml
      - research/zeno-release-audit/**
      - '!research/zeno-release-audit/README.md'

permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/research/zeno-validity-devnet:${{ github.workspace }}/research/zeno-contract-authorization
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.26.0'
          cache: false

      - name: Bind the archived evidence to its source run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 077
          work="$(mktemp -d "$RUNNER_TEMP/zeno-release-audit.XXXXXX")"
          profile=research/zeno-release-audit/profile.json
          repository="$(jq -er '.repository' "$profile")"
          run="$(jq -er '.run' "$profile")"
          attempt="$(jq -er '.attempt' "$profile")"
          endpoint="repos/$repository/actions/runs/$run"
          gh api "$endpoint/attempts/$attempt" | jq -e --slurpfile pin "$profile" '
            $pin[0] as $source |
            .id == $source.run and .head_sha == $source.source and .run_attempt == $source.attempt and
            .path == ".github/workflows/zeno-validity-regtest-release.yml" and .status == "completed" and .conclusion == "success"'
          gh api "$endpoint/attempts/$attempt/jobs" | jq -e --slurpfile pin "$profile" '
            $pin[0] as $source |
            any(.jobs[]; .id == $source.job and .head_sha == $source.source and .conclusion == "success" and
              any(.steps[]; .name == "Confirm the valid devnet batch and observe eligibility" and .conclusion == "success") and
              any(.steps[]; .name == "Verify the state proofs and confirm the exact regtest transaction" and .conclusion == "success"))'
          gh api "$endpoint/artifacts" | jq -e --slurpfile pin "$profile" '
            $pin[0] as $source | .artifacts as $published |
            all($source.artifacts[]; . as $item |
              any($published[]; .id == $item.id and .name == $item.name and .size_in_bytes == $item.bytes and
                .workflow_run.id == $source.run and .workflow_run.head_sha == $source.source and
                .expired == false and .digest == ("sha256:" + $item.sha256)))'
          {
            printf 'AUDIT_WORK=%s\n' "$work"
            printf 'SOURCE_REPO=%s\n' "$repository"
            printf 'SOURCE_RUN=%s\n' "$run"
            printf 'SOURCE_ARTIFACTS=%s\n' "$(jq -er '[.artifacts[].id] | join(",")' "$profile")"
          } >> "$GITHUB_ENV"

      - name: Download the four pinned evidence archives
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          artifact-ids: ${{ env.SOURCE_ARTIFACTS }}
          path: ${{ env.AUDIT_WORK }}/evidence
          merge-multiple: true
          digest-mismatch: error
          github-token: ${{ github.token }}
          repository: ${{ env.SOURCE_REPO }}
          run-id: ${{ env.SOURCE_RUN }}

      - name: Build the offline Groth16 checker with the pinned key and dependency lock
        shell: bash
        env:
          GOMODCACHE: ${{ env.AUDIT_WORK }}/modules
          GOCACHE: ${{ env.AUDIT_WORK }}/go-cache
        run: |
          timeout --kill-after=5s 9m bash research/zeno-release-audit/build-checker.sh "$AUDIT_WORK"

      - name: Verify the archived journal, state paths, Groth16 proof and release receipt
        shell: bash
        run: |
          umask 077
          timeout 60s python3 -B research/zeno-release-audit/audit.py \
            "$AUDIT_WORK/evidence" "$AUDIT_WORK/checker/verify-groth16" "$AUDIT_WORK/checker/groth16_vk.bin" \
            | tee "$AUDIT_WORK/audit.json"
          printf '## Archived release verification\n\n' >> "$GITHUB_STEP_SUMMARY"
          jq -r '
            "- Source run \(.sourceRun), attempt \(.sourceAttempt) at \(.sourceRevision)",
            "- \(.settlementProofs) Settlement proofs and \(.contractProofs) contract state proofs",
            "- Reconstructed journal and verified Groth16 proof SHA-256 \(.groth16ProofSha256)",
            "- Pinned eligible Momentum \(.eligibleMomentum) with stale and conflicting views rejected",
            "- Recorded regtest payout \(.recordedPayoutSats) satoshis in \(.recordedBitcoinTxid)"
          ' "$AUDIT_WORK/audit.json" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: zeno-release-audit-result
          path: ${{ env.AUDIT_WORK }}/audit.json
          if-no-files-found: error
          retention-days: 90
