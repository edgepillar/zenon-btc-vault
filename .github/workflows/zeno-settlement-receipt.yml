name: Zeno Settlement receipt verification

on:
  push:
    branches: [prove-settlement-on-devnet]
    paths:
      - .github/workflows/zeno-settlement-receipt.yml
      - research/zeno-settlement-proof/run-devnet.sh
      - research/zeno-settlement-proof/verify-on-devnet.ts
      - research/zeno-withdrawal/bootstrap.py

permissions:
  contents: read
  actions: read

env:
  PROOF_RUN: '45916994671'
  PROOF_JOB: '140238569759'
  PROOF_HEAD: 'f59d7a4cc71241e91c8c9568f4817455216e2e1f'
  PROOF_ARTIFACT: '15163885284'
  PROOF_ARCHIVE: 'sha256:97550b33c79cb091a245ae18682c848f2f6e4d84e7786b2639413bbd02019cb1'
  FIXTURE_SHA256: '2d7bb73cda34c6794206b9d5b4847b833b8aedc6bae801c2b2e7b831798ed98a'
  GUEST_KEY: '0x007ad642f4d257c339807e97f10dcfd1b80dc226c7aca7cc6a341ca133738a59'

jobs:
  devnet:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
      GIT_TERMINAL_PROMPT: '0'
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: url.https://github.com/.insteadOf
      GIT_CONFIG_VALUE_0: 'ssh://git@github.com/'
      GIT_CONFIG_KEY_1: url.https://github.com/.insteadOf
      GIT_CONFIG_VALUE_1: 'git@github.com:'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.23.12'
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.17.0
          package-manager-cache: false
      - name: Bind the verified Groth16 fixture and reserve devnet storage
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PROOF_RUN" | jq -e \
            --arg head "$PROOF_HEAD" '.head_sha == $head and .run_attempt == 1'
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PROOF_RUN/attempts/1/jobs" | jq -e \
            --argjson job "$PROOF_JOB" 'any(.jobs[]; .id == $job and .name == "groth16" and .conclusion == "success")'
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$PROOF_ARTIFACT" | jq -e \
            --arg head "$PROOF_HEAD" --arg digest "$PROOF_ARCHIVE" --argjson run "$PROOF_RUN" \
            '.workflow_run.id == $run and .workflow_run.head_sha == $head and .digest == $digest and
             .name == "zeno-settlement-groth16-fixture" and .expired == false and .size_in_bytes <= 8192'
          umask 077
          work="$(mktemp -d "$RUNNER_TEMP/settlement-receipt.XXXXXX")"
          printf 'SETTLEMENT_WORK=%s\n' "$work" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          artifact-ids: ${{ env.PROOF_ARTIFACT }}
          path: ${{ env.SETTLEMENT_WORK }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.PROOF_RUN }}
      - name: Verify the proof through embedded Settlement
        shell: bash
        run: |
          printf '%s  %s\n' "$FIXTURE_SHA256" "$SETTLEMENT_WORK/fixture.json" | sha256sum --check --strict
          bash research/zeno-settlement-proof/run-devnet.sh "$SETTLEMENT_WORK" "$GUEST_KEY" "$SETTLEMENT_WORK/fixture.json"
          evidence="$SETTLEMENT_WORK/settlement-evidence.json"
          test "$(stat -c%s "$evidence")" -le 49152
          printf 'SETTLEMENT_DEVNET_EVIDENCE_SHA256 '
          sha256sum < "$evidence" | cut -d ' ' -f 1
          printf 'SETTLEMENT_DEVNET_EVIDENCE '
          cat "$evidence"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: zeno-settlement-devnet-evidence
          path: ${{ env.SETTLEMENT_WORK }}/settlement-evidence.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
