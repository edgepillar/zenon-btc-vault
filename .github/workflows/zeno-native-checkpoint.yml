name: Zeno native checkpoint qualification

on:
  push:
    branches: [verify-native-release-checkpoint]
    paths:
      - .github/workflows/zeno-native-checkpoint.yml
      - research/zeno-native-checkpoint/**
      - '!research/zeno-native-checkpoint/README.md'
      - research/zeno-validity-devnet/run-devnet.sh

permissions:
  actions: read
  contents: read

env:
  CAPTURE_RUN: '46026658716'
  CAPTURE_HEAD: '02a4833d5c5e5ad77de8352672b5ea56f1f00684'
  PROPOSAL_ARTIFACT: '15214366639'
  PROPOSAL_ARCHIVE: 'sha256:b6bd52720ba553efaee1a5b9b497fe01c898be1aba1c9dbc6e2cc33213825074'
  PROPOSAL_SHA256: 'a2b3f422f2e8db88acf1807b8b2f5a4d51bcaf811db916a8650e914a90dfff12'
  PENDING_SHA256: '555b4cd5e3d75846796ed9aab8168a2098a83b909f22c83ef0f13c15702e9d93'
  STATEMENT_SHA256: 'a65a1534050916b947f7016d1dc02449547b437852704c3dc327b0e1ed717022'
  CHECKPOINT_ARTIFACT: '15214426565'
  CHECKPOINT_ARCHIVE: 'sha256:6159dc0bf476215bcc17d3edb0cd83863662e65829bbbbc7d024ca20bd2e0fd9'
  CHECKPOINT_SHA256: '01e6993848bcce8aa91c584d56671dd75281de5b209775fe25da75f767c7208d'
  PROOF_RUN: '46030531390'
  PROOF_HEAD: '9d66cb2b376c61d143e8534e0c39c0fcf2e43525'
  PROOF_JOB: '140678025767'
  FIXTURE_ARTIFACT: '15223754159'
  FIXTURE_ARCHIVE: 'sha256:d65b3d35a8aaf8d207ec001951cf6fce8218a93085387c183cccc952a7a54c11'
  FIXTURE_SHA256: '6067cb907a1bd3fdd9ff23976f51d80d86886c0c1bb71d35e9f602ed56e1e839'
  JOURNAL: '42b7c623baa319b2d79e95f38b183bd9a44feb4e25ae8cdcbead3ffc06399f03'
  GOTOOLCHAIN: local
  GOWORK: 'off'
  GIT_TERMINAL_PROMPT: '0'
  GIT_CONFIG_COUNT: '2'
  GIT_CONFIG_KEY_0: url.https://github.com/.insteadOf
  GIT_CONFIG_VALUE_0: 'ssh://git@github.com/'
  GIT_CONFIG_KEY_1: url.https://github.com/.insteadOf
  GIT_CONFIG_VALUE_1: 'git@github.com:'

jobs:
  checkpoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 49
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.26.0'
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.17.0
          package-manager-cache: false

      - name: Bind the prior checkpoint and validity proof to their source runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          endpoint="repos/$GITHUB_REPOSITORY/actions"
          check_run() {
            gh api "$endpoint/runs/$1" | jq -e --arg head "$2" \
              '.head_sha == $head and .run_attempt == 1 and .conclusion == "success"'
          }
          check_artifact() {
            local run="$1" head="$2" artifact="$3" digest="$4" name="$5" bytes="$6"
            gh api "$endpoint/artifacts/$artifact" | jq -e --arg head "$head" --arg digest "$digest" \
              --arg name "$name" --argjson run "$run" --argjson bytes "$bytes" '
              .workflow_run.id == $run and .workflow_run.head_sha == $head and .expired == false and
              .name == $name and .digest == $digest and .size_in_bytes == $bytes'
          }
          check_run "$CAPTURE_RUN" "$CAPTURE_HEAD"
          gh api "$endpoint/runs/$CAPTURE_RUN/attempts/1/jobs" | jq -e '
            any(.jobs[]; .name == "capture" and .conclusion == "success") and
            any(.jobs[]; .name == "restore" and .conclusion == "success")'
          check_run "$PROOF_RUN" "$PROOF_HEAD"
          gh api "$endpoint/runs/$PROOF_RUN/attempts/1/jobs" | jq -e --argjson job "$PROOF_JOB" '
            any(.jobs[]; .id == $job and .name == "groth16" and .conclusion == "success")'
          check_artifact "$CAPTURE_RUN" "$CAPTURE_HEAD" "$PROPOSAL_ARTIFACT" "$PROPOSAL_ARCHIVE" zeno-live-proposal 11888
          check_artifact "$CAPTURE_RUN" "$CAPTURE_HEAD" "$CHECKPOINT_ARTIFACT" "$CHECKPOINT_ARCHIVE" zeno-live-devnet-checkpoint 9892164
          check_artifact "$PROOF_RUN" "$PROOF_HEAD" "$FIXTURE_ARTIFACT" "$FIXTURE_ARCHIVE" zeno-live-validity-groth16 1223
          umask 077
          work="$(mktemp -d "$RUNNER_TEMP/zeno-native-checkpoint.XXXXXX")"
          printf 'VALIDITY_WORK=%s\n' "$work" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          artifact-ids: ${{ env.PROPOSAL_ARTIFACT }}
          path: ${{ env.VALIDITY_WORK }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.CAPTURE_RUN }}
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          artifact-ids: ${{ env.CHECKPOINT_ARTIFACT }}
          path: ${{ env.VALIDITY_WORK }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.CAPTURE_RUN }}
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          artifact-ids: ${{ env.FIXTURE_ARTIFACT }}
          path: ${{ env.VALIDITY_WORK }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.PROOF_RUN }}

      - name: Observe the proven batch and verify its native checkpoint
        shell: bash
        run: |
          work="$VALIDITY_WORK"
          cd "$work"
          printf '%s  %s\n' "$CHECKPOINT_SHA256" checkpoint.tar "$PROPOSAL_SHA256" proposal.json \
            "$PENDING_SHA256" pending.json "$STATEMENT_SHA256" statement.json "$FIXTURE_SHA256" fixture.json | sha256sum --check --strict
          test "$(jq -er '.journal' statement.json)" = "$JOURNAL"
          test "$(jq -er '.journal' fixture.json)" = "$JOURNAL"
          timeout --kill-after=30s 43m bash "$GITHUB_WORKSPACE/research/zeno-validity-devnet/run-devnet.sh" submit-native "$work"
          sha256sum acceptance.json native-checkpoint.json > native.sha256
          cat native.sha256
          printf '## Native devnet checkpoint\n\n' >> "$GITHUB_STEP_SUMMARY"
          jq -r '
            "- Selected eligible Momentum \(.selected.height) with state root \(.selected.stateRoot)",
            "- Agreed cut at Momentum \(.cut.height) with hash \(.cut.hash)",
            "- \(.headers | length) signed headers verified using parent-state elections on both nodes",
            "- \(.controls | join(", "))"
          ' native-checkpoint.json >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: zeno-native-checkpoint
          path: |
            ${{ env.VALIDITY_WORK }}/acceptance.json
            ${{ env.VALIDITY_WORK }}/native-checkpoint.json
            ${{ env.VALIDITY_WORK }}/native.sha256
          if-no-files-found: error
          retention-days: 90
