name: Zeno live validity witness and checkpoint

on:
  push:
    branches: [prove-validity-on-devnet]
    paths:
      - research/zeno-validity-devnet/run-devnet.sh
      - research/zeno-validity-devnet/witness.go
      - research/zeno-validity-devnet/checkpoint.py
      - research/zeno-contract-authorization/capture.ts
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  GOWORK: 'off'
  GIT_TERMINAL_PROMPT: '0'
  GIT_CONFIG_COUNT: '2'
  GIT_CONFIG_KEY_0: url.https://github.com/.insteadOf
  GIT_CONFIG_VALUE_0: 'ssh://git@github.com/'
  GIT_CONFIG_KEY_1: url.https://github.com/.insteadOf
  GIT_CONFIG_VALUE_1: 'git@github.com:'

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    outputs:
      checkpoint_sha256: ${{ steps.capture.outputs.checkpoint }}
      proposal_sha256: ${{ steps.capture.outputs.proposal }}
      pending_sha256: ${{ steps.capture.outputs.pending }}
      statement_sha256: ${{ steps.capture.outputs.statement }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.26.0'
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.17.0
          package-manager-cache: false

      - name: Admit three calls and build the proposal before acceptance
        id: capture
        shell: bash
        run: |
          umask 077
          work="$(mktemp -d "$RUNNER_TEMP/zeno-live-capture.XXXXXX")"
          printf 'VALIDITY_WORK=%s\n' "$work" >> "$GITHUB_ENV"
          timeout --kill-after=60s 67m bash research/zeno-validity-devnet/run-devnet.sh capture "$work"
          for name in checkpoint proposal pending statement; do
            file="$work/$name.json"
            if [[ "$name" = checkpoint ]]; then file="$work/checkpoint.tar"; fi
            sha="$(sha256sum < "$file" | cut -d ' ' -f 1)"
            printf 'VALIDITY_CAPTURE_SHA256 %s %s\n' "$name" "$sha"
            printf '%s=%s\n' "$name" "$sha" >> "$GITHUB_OUTPUT"
          done
          printf 'VALIDITY_STATEMENT '
          cat "$work/statement.json"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: zeno-live-proposal
          path: |
            ${{ env.VALIDITY_WORK }}/pending.json
            ${{ env.VALIDITY_WORK }}/statement.json
            ${{ env.VALIDITY_WORK }}/proposal.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: zeno-live-devnet-checkpoint
          path: ${{ env.VALIDITY_WORK }}/checkpoint.tar
          compression-level: 3
          if-no-files-found: error
          retention-days: 7

  restore:
    needs: capture
    runs-on: ubuntu-24.04
    timeout-minutes: 36
    env:
      CHECKPOINT_SHA256: ${{ needs.capture.outputs.checkpoint_sha256 }}
      PROPOSAL_SHA256: ${{ needs.capture.outputs.proposal_sha256 }}
      PENDING_SHA256: ${{ needs.capture.outputs.pending_sha256 }}
      STATEMENT_SHA256: ${{ needs.capture.outputs.statement_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.26.0'
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.17.0
          package-manager-cache: false

      - name: Allocate the fresh restore workspace
        shell: bash
        run: |
          umask 077
          work="$(mktemp -d "$RUNNER_TEMP/zeno-live-restore.XXXXXX")"
          printf 'VALIDITY_WORK=%s\n' "$work" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: zeno-live-proposal
          path: ${{ env.VALIDITY_WORK }}
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: zeno-live-devnet-checkpoint
          path: ${{ env.VALIDITY_WORK }}

      - name: Verify the restored chain still has the same pending inputs
        shell: bash
        run: |
          work="$VALIDITY_WORK"
          printf '%s  %s\n' "$CHECKPOINT_SHA256" "$work/checkpoint.tar" "$PROPOSAL_SHA256" "$work/proposal.json" \
            "$PENDING_SHA256" "$work/pending.json" "$STATEMENT_SHA256" "$work/statement.json" | sha256sum --check --strict
          timeout --kill-after=30s 32m bash research/zeno-validity-devnet/run-devnet.sh preflight "$work"
