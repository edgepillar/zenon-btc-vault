name: Zeno proposed batch Core proof retry

on:
  push:
    branches: [prove-proposed-zeno-batch]
    paths:
      - .github/workflows/zeno-validity-core-retry.yml

permissions:
  actions: read
  contents: read

env:
  SOURCE_RUN: '45983864343'
  SOURCE_HEAD: '97175d393548b23d1afbbc5e127159b7d943f362'
  WITNESS_ARTIFACT: '15191441539'
  WITNESS_ARCHIVE: 'sha256:079394e795640209d8c5fb4fc199b4fc6c5a10837cdcb96e0d3b8b62a3251812'
  WITNESS_SHA256: '74f92f8bcf464db358df19ac8fc390cb36c646477ab8f0c264eb0572b44fb695'
  PROVER_ARTIFACT: '15191636225'
  PROVER_ARCHIVE: 'sha256:da3a368f90bca1b51c8fa398937d28ba4b38217280229948ba7b7a2256814edb'
  GUEST_KEY: '0x00e4e8f52c5c085d833abcfacbbf0270e9832cd2af090ae12f7659c08270ffa4'
  JOURNAL: '5162e7804a4a92a8fe7060e857519eee50ad31ec9577a6509b5693e1e6bf7f56'

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 135
    env:
      RAYON_NUM_THREADS: '4'
      ELEMENT_THRESHOLD: '55000000'
      TRACE_GEN_WORKERS: '1'
      CHECKPOINTS_CHANNEL_CAPACITY: '2'
      RECORDS_AND_TRACES_CHANNEL_CAPACITY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Bind both inputs to the completed qualification jobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          endpoint="repos/$GITHUB_REPOSITORY/actions"
          gh api "$endpoint/runs/$SOURCE_RUN" | jq -e --arg head "$SOURCE_HEAD" \
            '.head_sha == $head and .run_attempt == 1 and .conclusion == "failure"'
          gh api "$endpoint/runs/$SOURCE_RUN/attempts/1/jobs" | jq -e '
            any(.jobs[]; .id == 140454345462 and .name == "statement" and .conclusion == "success") and
            any(.jobs[]; .id == 140458564673 and .name == "settlement" and .conclusion == "success") and
            any(.jobs[]; .id == 140458911997 and .name == "proof" and .conclusion == "failure")'
          check_artifact() {
            local id="$1" name="$2" digest="$3" max_bytes="$4"
            gh api "$endpoint/artifacts/$id" | jq -e --arg head "$SOURCE_HEAD" --argjson run "$SOURCE_RUN" \
              --arg name "$name" --arg digest "$digest" --argjson max "$max_bytes" '
              .workflow_run.id == $run and .workflow_run.head_sha == $head and .expired == false and
              .name == $name and .digest == $digest and .size_in_bytes <= $max'
          }
          check_artifact "$WITNESS_ARTIFACT" zeno-proposed-batch-witness "$WITNESS_ARCHIVE" 49152
          check_artifact "$PROVER_ARTIFACT" checked-zeno-proposal-prover "$PROVER_ARCHIVE" 134217728
          umask 077
          work="$(mktemp -d "$RUNNER_TEMP/zeno-validity-core.XXXXXX")"
          printf 'VALIDITY_WORK=%s\n' "$work" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          artifact-ids: ${{ env.WITNESS_ARTIFACT }}
          path: ${{ env.VALIDITY_WORK }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN }}
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          artifact-ids: ${{ env.PROVER_ARTIFACT }}
          path: ${{ env.VALIDITY_WORK }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN }}

      - name: Prove the checked guest journal with reserved spill space
        shell: bash
        env:
          RUST_LOG: zkm_core_machine::utils::prove=info,zkm_prover=info
        run: |
          source research/zeno-settlement-proof/prover-resources.sh
          work="$VALIDITY_WORK"
          cd "$work"
          printf '%s  %s\n' "$WITNESS_SHA256" proposal.json | sha256sum --check --strict
          test "$(stat --format=%s simple-go-host)" -le "$((128 * 1024 * 1024))"
          chmod 0500 simple-go-host
          got="$(timeout 90s ./simple-go-host guest-key | awk '$1 == "BATCH_GUEST_KEY" {print $2}')"
          test "$got" = "$GUEST_KEY"
          printf 'PROPOSAL_PROVER_SHA256 '
          sha256sum < simple-go-host | cut -d ' ' -f 1
          enable_prover_swap "$work" 32
          test "$(awk '/^(MemTotal|SwapTotal):/ {sum += $2} END {print sum}' /proc/meminfo)" -ge "$((32 * 1024 * 1024))"
          ulimit -f 524288
          /usr/bin/time -f 'PROPOSAL_PROVER_SECONDS %e MAX_RSS_KIB %M EXIT %x' \
            timeout --kill-after=20s 120m nice -n 8 ./simple-go-host prove proposal.json "$JOURNAL" proof.bin

      - name: Reopen the Core proof and reject a changed journal
        shell: bash
        run: |
          cd "$VALIDITY_WORK"
          timeout --kill-after=10s 8m ./simple-go-host verify "$JOURNAL" proof.bin
          printf 'PROPOSAL_CORE_SHA256 '
          sha256sum < proof.bin | cut -d ' ' -f 1

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: zeno-proposed-batch-core-proof
          path: ${{ env.VALIDITY_WORK }}/proof.bin
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
