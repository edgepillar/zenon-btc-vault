name: Bitcoin regtest

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run unit tests
        run: python3 -B -m unittest discover -s tests -v

      - name: Run vault integration against Bitcoin Core 32.1
        shell: bash
        run: |
          umask 077
          work_dir="$(mktemp -d "${RUNNER_TEMP}/zenon-btc-vault.XXXXXX")"
          bash .github/scripts/install-bitcoind.sh "$work_dir"
          datadir="$(mktemp -d "${work_dir}/regtest-data.XXXXXX")"
          python3 -B regtest.py --bitcoind "${work_dir}/bitcoind" --datadir "$datadir"
          fees_datadir="$(mktemp -d "${work_dir}/regtest-fees.XXXXXX")"
          python3 -B regtest_fee_paths.py --bitcoind "${work_dir}/bitcoind" --datadir "$fees_datadir"
